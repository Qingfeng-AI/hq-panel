name: HQ Panel Daily
on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python cqi.py probe || true
      - run: python cqi.py all || echo "CQI partial"
      - run: python panel.py all || echo "panel partial"
      - run: |
          git config user.name "hq-panel-bot"
          git config user.email "hq-panel-bot@users.noreply.github.com"
          git add data reports || true
          git commit -m "panel $(date -u +%F)" || echo "no changes"
          git push
