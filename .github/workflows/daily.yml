name: HQ Panel Daily
on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "*.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/daily.yml"
env:
  PYTHONUNBUFFERED: "1"
permissions:
  contents: read
concurrency:
  group: hq-panel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  run:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Require configured FRED API access
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -c "from fred_api import require_api_key; require_api_key()"
      - name: Fetch and validate real CQI data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python cqi.py all
      - name: Fetch and validate real panel data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python panel.py all
      - name: Commit validated reports on default branch only
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "hq-panel-bot"
          git config user.email "hq-panel-bot@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "panel $(date -u +%F)"
            git push
          fi
