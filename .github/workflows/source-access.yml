name: Official source access check
on:
  pull_request:
    paths:
      - ".github/workflows/source-access.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check distinct live resources and documented public API
        run: |
          python3 -u - <<'PY'
          import concurrent.futures, datetime, json, urllib.request
          year = datetime.date.today().year
          # Public API documented by CFTC's PRE TFF Futures Only page.
          urls = {
              "cftc_current_year": f"https://www.cftc.gov/files/dea/history/fut_fin_txt_{year}.zip",
              "cftc_official_public_api": "https://publicreporting.cftc.gov/resource/gpe5-46if.json?$limit=1&$order=report_date_as_yyyy_mm_dd%20DESC",
              "fred_iorb": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=IORB",
              "fred_ioer_bounded": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=IOER&cosd=2018-04-02&coed=2021-07-28",
          }
          def check(item):
              name, url = item
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "HQ-Research-CQI/0.1 (research pipeline)"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read()
                      print(json.dumps({"source": name, "status": r.status, "bytes": len(body), "prefix": body[:50].decode("utf-8", "replace")}), flush=True)
                      return True
              except Exception as e:
                  print(json.dumps({"source": name, "error": str(e)}), flush=True)
                  return False
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(check, urls.items()))
          if not all(results):
              raise SystemExit(1)
          PY
